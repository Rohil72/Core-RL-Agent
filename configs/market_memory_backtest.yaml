data:
  train_latents: "reports/latent_analysis/latents_20260616_073741.parquet"
  test_latents: "reports/latent_analysis/test_latents_20260621_184044.parquet"
  precomputed_glob: "data/precomputed_v2/*.parquet"
  output_dir: "reports/market_memory_backtests"

memory:
  k: 25
  same_ticker_neighbor_limit: 0.50
  target_upside: "future_max_return_63"
  target_downside: "future_min_return_63"
  target_path_quality: "event_upside_before_drawdown_126"
  expected_upside_weight: 1.00
  path_quality_weight: 0.10
  downside_weight: 0.80
  uncertainty_weight: 0.20
  confidence_weight: 0.10
  disagreement_weight: 0.10
  aggregation_method: "gaussian"
  trim_fraction: 0.10
  tail_fraction: 0.25
  target_holding_period: "event_peak_offset_63"

policy:
  top_k: 3
  min_score: 0.03
  min_expected_upside: 0.04
  max_expected_downside: 0.12
  min_confidence: 0.20
  min_hold_days: 5
  max_hold_days: 63
  exit_score_fraction: 0.50
  exit_min_score: 0.01
  stop_loss: 0.10
  slippage_bps: 10
  initial_capital: 100000

evaluation:
  baselines: "model_head,momentum,random"
  random_seed: 7
  momentum_window: 21

run:
  dry_run_rows: 500
  write_neighbors: true
  write_memory_reports: true
