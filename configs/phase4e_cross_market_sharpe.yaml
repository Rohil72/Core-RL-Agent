experiment:
  phase: 4E
  name: cross_market_sharpe_policy
  source_run: reports/phase4c/phase4c_v1
  output_root: reports/phase4e
  expected_folds: 5
  expected_seeds: [7, 17, 37]
  minimum_complete_runs: 14
  active_folds: []
  active_seeds: [7, 17, 37]
  validation_split: val
  confirmation_splits: [test, holdout]

data:
  precomputed_glob: data/precomputed_v2/*.parquet

relative_outcomes:
  enabled: true
  return_target: future_return_63
  sector_column: sector
  minimum_sector_observations: 3
  universe_alpha_column: future_universe_alpha_63
  blended_alpha_column: future_blended_alpha_63
  sector_weight: 0.50

ood_calibration:
  sample_size: 2048
  distance_quantile: 0.95
  seed: 7

memory_defaults:
  k: 25
  causal_horizon_sessions: 126
  minimum_neighbor_separation_sessions: 21
  same_ticker_mode: exclude
  same_ticker_neighbor_limit: null
  exclude_query_sector: false
  exclude_query_industry: false
  target_upside: future_max_return_63
  target_downside: future_min_return_63
  target_path_quality: event_upside_before_drawdown_126
  target_holding_period: event_peak_offset_63
  aggregation_method: gaussian
  trim_fraction: 0.10
  tail_fraction: 0.25
  min_neighbors: 15
  max_median_distance: null
  confidence_reference_distance: null
  require_outcome_availability: true
  retrieval_batch_size: 128

policy:
  top_k: 3
  min_score: 0.0
  min_expected_upside: 0.0
  max_expected_downside: 0.12
  min_confidence: 0.20
  min_alpha_lcb: 0.0
  max_downside_cvar: 0.12
  min_neighbor_count: 15
  require_ood_pass: true
  min_hold_days: 5
  max_hold_days: 63
  exit_score_fraction: 0.50
  exit_min_score: 0.0
  stop_loss: 0.10
  slippage_bps: 10
  initial_capital: 100000
  risk_guard_enabled: true
  cooldown_sessions: 63
  rolling_loss_window_sessions: 126
  quarantine_sessions: 126
  max_stop_losses: 2
  cumulative_loss_limit: -0.15

variants:
  - id: A0_legacy_identity
    metric: original
    target_alpha: null
    score_mode: legacy
  - id: A1_universe_alpha_identity
    metric: original
    target_alpha: future_universe_alpha_63
    score_mode: alpha_lcb
  - id: A2_blended_alpha_identity
    metric: original
    target_alpha: future_blended_alpha_63
    score_mode: alpha_lcb

policy_candidates:
  - id: A0_base
    semantic: A0_legacy_identity
    overrides: {}
  - id: A1_base
    semantic: A1_universe_alpha_identity
    overrides: {}
  - id: A1_selective
    semantic: A1_universe_alpha_identity
    overrides:
      top_k: 2
      min_alpha_lcb: 0.005
      min_confidence: 0.30
      max_downside_cvar: 0.10
      max_hold_days: 42
  - id: A2_base
    semantic: A2_blended_alpha_identity
    overrides: {}
  - id: A2_selective
    semantic: A2_blended_alpha_identity
    overrides:
      top_k: 2
      min_alpha_lcb: 0.005
      min_confidence: 0.30
      max_downside_cvar: 0.10
      max_hold_days: 42
  - id: A2_defensive
    semantic: A2_blended_alpha_identity
    overrides:
      top_k: 2
      min_alpha_lcb: 0.010
      min_confidence: 0.35
      max_downside_cvar: 0.08
      max_expected_downside: 0.10
      max_hold_days: 42
      stop_loss: 0.08
  - id: A2_concentrated
    semantic: A2_blended_alpha_identity
    overrides:
      top_k: 1
      min_alpha_lcb: 0.005
      min_confidence: 0.25
      max_downside_cvar: 0.10
      max_hold_days: 42
  - id: A2_balanced
    semantic: A2_blended_alpha_identity
    overrides:
      top_k: 3
      min_alpha_lcb: 0.005
      min_confidence: 0.25
      max_downside_cvar: 0.10
      max_hold_days: 42

selection:
  baseline_candidate: A0_base
  target_pooled_sharpe: 2.0
  target_cross_market_oof_sharpe: 2.0
  minimum_fold_sharpe: 0.50
  minimum_mean_excess_return: 0.0
  minimum_positive_run_fraction: 0.70
  minimum_positive_fold_excess_fraction: 0.60
  maximum_worst_drawdown: 0.25
  minimum_mean_trade_count: 10
  minimum_deflated_sharpe_probability: 0.80
  maximum_pbo: 0.50
  bootstrap_samples: 2000
  bootstrap_block_length: 20
  objective:
    pooled_sharpe_weight: 1.0
    minimum_fold_sharpe_weight: 0.25
    mean_excess_return_weight: 2.0
    drawdown_weight: 0.50

ensemble:
  minimum_votes: 2
