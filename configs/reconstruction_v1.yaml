schema_version: 1

study:
  title: "Causal Historical Market Memory Reconstruction, Baselines, and Ablations"
  run_family: "reports/reconstruction_v1"
  declaration: "New scientific study performed after retrospective inspection under a newly frozen, immutable contract."
  seeds: [7, 17, 37]
  device: "cuda"
  allow_cpu_fallback: true
  use_amp: true

