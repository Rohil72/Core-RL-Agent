periods:
  encoder_fit: ["2013-01-01", "2020-12-31"]
  encoder_validation: ["2021-01-01", "2021-12-31"]
  representation_evaluation: ["2022-01-01", "2022-12-31"]
  policy_development: ["2022-01-01", "2023-12-31"]
  development_evaluation: ["2024-01-01", "2024-12-31"]
  later_common_window: ["2025-01-01", "2026-03-31"]

encoder:
  window_size: 252
  num_features: 28
  d_model: 96
  nhead: 4
  num_layers: 4
  patch_size: 5
  latent_dim: 128
  num_memory_slots: 8
  dropout: 0.10
  training:
    epochs: 12
    batch_size: 64
    learning_rate: 0.0004
    weight_decay: 0.0001
    future_loss_weight: 1.0
    reconstruction_loss_weight: 0.02
    action_loss_weight: 0.0
    grad_clip: 5.0
    strict_cutoff_contract: true

memory:
  nominal_k: 25
  min_neighbors: 15
  causal_horizon_sessions: 126
  minimum_neighbor_separation_sessions: 21
  same_ticker_mode: "exclude"
  aggregation_method: "gaussian"
  trim_fraction: 0.10
  tail_fraction: 0.25
  retrieval_batch_size: 128

policy:
  initial_capital: 100000.0
  max_positions: 3
  min_hold_days: 5
  max_hold_days: 63
  stop_loss: 0.10
  exit_score_fraction: 0.50
  exit_min_score: 0.0
  risk_guard_enabled: true
  cooldown_sessions: 63
  fill_convention: "next_open"

reliability:
  target_event: "future_blended_alpha_63 > 0.002"
  fit_fraction: 0.70
  calibration_embargo_sessions: 63
  minimum_fit_rows: 500
  minimum_calibration_rows: 200
  logistic_c: 0.10
  isotonic_minimum_unique_scores: 10
  nominal_coverage: 0.25
  sweep_coverages: [0.25, 0.50, 0.75, 1.00]

primary_systems:
  P0: "Full learned-state distributional memory"
  P1: "No external memory"
  P2: "Same-neighbour mean-only memory"
  P3: "Raw-feature kNN memory"
  P4: "Momentum-21 ranking"
  P5: "Random ranking"
  P6: "Equal-weight buy-and-hold context"

statistical_methods:
  bootstrap_method: "moving_block"
  primary_block_length_sessions: 21
  sensitivity_block_lengths: [5, 63]
  bootstrap_iterations: 1000
  multiplicity_correction: "holm"
