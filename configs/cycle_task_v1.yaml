task:
  name: delayed_cycle_detection_v1
  description: >
    Daily state-wise cycle reasoning with delayed fundamental confirmation,
    Minervini-style trend qualification, and bounded asymmetric exit scoring.

oracle:
  min_window_days: 21
  max_window_days: 252
  min_return: 0.30
  reversion:
    mode: fixed
    max_drawdown_from_start: 0.02
    volatility_multiplier: 1.5

confirmation:
  eps_rolling2_yoy_formula: mean(EPS_t, EPS_t-1) / mean(EPS_t-4, EPS_t-5) - 1
  eps_rolling2_yoy_threshold: 0.15
  eps_surprise_threshold: 0.0
  revenue_rolling2_yoy_threshold: 0.0
  revenue_fallback: eps_only

actions:
  0: neutral
  1: enter
  2: hold_or_renew
  3: exit
  invalid_action_penalty: -0.05
  cooldown_days_after_cycle_end: 42
  single_open_thesis_per_ticker: true

gating:
  enabled: true
  template_gate_min_score: 6
  use_exchange_portable_context: true
  market_features:
    - benchmark_trend
    - benchmark_volatility
    - relative_strength_vs_benchmark
    - sector_or_index_trend

reward:
  delayed_cycle_level: true
  use_bounded_exit_penalty: true
  exit_penalty_asymmetric: true
  miss_penalty_scope: per_cycle
  false_positive_focus: hard_negatives

evaluation:
  primary_metric: cycle_precision_at_fixed_recall
  secondary_metrics:
    - hard_negative_false_positive_rate
    - cycle_recall
    - lead_time_distribution
    - bounded_exit_error
  split_strategy:
    type: rolling_walk_forward
    include_ticker_holdout_table: true

logging:
  precompute_manifest: data/precomputed/manifest.json
  dataset_reports_dir: reports/data_quality
  experiment_reports_dir: reports/experiments
