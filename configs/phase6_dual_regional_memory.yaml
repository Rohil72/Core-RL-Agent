schema_version: 1

experiment:
  phase: 6-dual-regional-memory
  source_run: reports/final_testbed/phase6_a30_final_v1
  source_testbed_config: configs/final_research_testbed.yaml
  output_root: reports/phase6_dual_regional_memory
  seeds: [7, 17, 37]
  markets: [US, India, China, Brazil, France, UK]
  development_period: policy_development
  selection_period: policy_selection

topologies:
  - id: global_dual_regional
    transformer_backbone: global_frozen
    internal_memory: regional
    external_memory: regional

alignment:
  epochs: 2
  encoder_learning_rate: 0.00003
  adapter_learning_rate: 0.0001
  weight_decay: 0.0001
  gradient_clip: 1.0
  maximum_future_mae_regression: 0.02
  encoder_parameter_scope: memory_only

loss:
  quantile_weight: 1.0
  ranking_weight: 0.50
  analogue_weight: 0.20
  vicreg_weight: 0.01
  rank_temperature: 0.20
  outcome_temperature: 0.50
  latent_temperature: 0.20
  vicreg_variance_target: 0.20

memory:
  k: 25
  causal_horizon_sessions: 126
  minimum_neighbor_separation_sessions: 21
  same_ticker_mode: exclude
  aggregation_method: gaussian
  trim_fraction: 0.10
  tail_fraction: 0.25
  min_neighbors: 15
  retrieval_batch_size: 128

policy:
  top_k: 3
  min_score: 0.0
  min_expected_upside: 0.0
  max_expected_downside: 0.12
  min_confidence: 0.0
  min_alpha_lcb: null
  max_downside_cvar: 0.12
  min_neighbor_count: 15
  require_ood_pass: false
  min_hold_days: 5
  max_hold_days: 63
  exit_score_fraction: 0.50
  exit_min_score: 0.0
  stop_loss: 0.10
  initial_capital: 100000
  risk_guard_enabled: true
  cooldown_sessions: 63
  rolling_loss_window_sessions: 126
  quarantine_sessions: 126
  max_stop_losses: 2
  cumulative_loss_limit: -0.15

consensus:
  minimum_votes: 2
  exit_smoothing_span: 1
  exit_score_quantile: 0.50

reliability:
  fit_fraction: 0.70
  calibration_embargo_sessions: 63
  minimum_fit_rows: 500
  minimum_calibration_rows: 200
  logistic_c: 0.10
  isotonic_minimum_unique_scores: 10
  random_seed: 7
  minimum_useful_alpha: 0.002
  round_trip_cost_multiplier: 2.0

coverage_candidates:
  - id: coverage_100
    nominal_coverage: 1.00
  - id: coverage_075
    nominal_coverage: 0.75
  - id: coverage_050
    nominal_coverage: 0.50
  - id: coverage_025
    nominal_coverage: 0.25

selection:
  target_pooled_sharpe: 2.0
  minimum_median_market_sharpe: 0.50
  minimum_positive_markets: 4
  minimum_baseline_wins: 4
  minimum_positive_brier_skill_markets: 4
  minimum_positive_reliability_spread_markets: 4
  maximum_worst_drawdown: 0.20
  maximum_profit_concentration: 0.50
  minimum_deflated_sharpe_probability: 0.80
  maximum_pbo: 0.50

hardware:
  cuda_visible_devices: "0"
  minimum_vram_gb: 6
  minimum_compute_capability: [7, 5]
  vram_fraction: 0.95

