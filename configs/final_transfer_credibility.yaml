schema_version: 1

protocol:
  status: final_transfer_mechanism_and_credibility_study
  source_result_immutable: true
  transformer_training_allowed: false
  adapter_training_allowed: false
  offline_rl_allowed: false
  promotion_claim_allowed: false
  causal_timestamp_unit: ns
  path_quality_transform: bounded_excursion_share

experiment:
  source_run: reports/final_testbed/phase6_a30_final_v1
  source_decision_run: reports/final_memory_repair/final_memory_repair_v2
  source_decision_period_mode: combined
  source_layout: global_shared
  source_testbed_config: configs/final_research_testbed.yaml
  output_root: reports/final_transfer_credibility
  markets: [US, India, China, Brazil, France, UK]
  seeds: [7, 17, 37]

periods:
  development:
    start: 2022-01-01
    end: 2023-12-31
    evidence_status: development
  selection:
    start: 2024-01-01
    end: 2024-12-31
    evidence_status: development_selection
  observed_confirmation:
    start: 2025-01-01
    end: 2026-03-31
    evidence_status: contaminated_diagnostic_only

inference_refresh:
  enabled: false

memory_defaults:
  k: 25
  causal_horizon_sessions: 126
  minimum_neighbor_separation_sessions: 21
  same_ticker_mode: exclude
  same_ticker_neighbor_limit: null
  aggregation_method: gaussian
  trim_fraction: 0.10
  tail_fraction: 0.25
  min_neighbors: 15
  require_outcome_availability: true
  retrieval_batch_size: 128

exact_c0_targets:
  target_upside: future_max_return_63
  target_alpha: future_blended_alpha_63
  target_downside: future_min_return_63
  target_path_quality: event_upside_before_drawdown_126
  target_holding_period: event_peak_offset_63
  score_mode: alpha_lcb

rally_targets:
  target_upside: decision_mfe
  target_alpha: future_blended_alpha_63
  target_downside: decision_mae
  target_path_quality: decision_path_quality_bounded
  target_holding_period: decision_holding_sessions
  score_mode: alpha_predictive_tail

policy:
  top_k: 3
  min_score: 0.0
  min_expected_upside: 0.0
  max_expected_downside: 0.12
  min_confidence: 0.0
  min_alpha_lcb: null
  max_downside_cvar: 0.12
  min_neighbor_count: 15
  require_ood_pass: false
  min_hold_days: 5
  max_hold_days: 63
  exit_score_fraction: 0.50
  exit_min_score: 0.0
  stop_loss: 0.10
  initial_capital: 100000
  risk_guard_enabled: true
  cooldown_sessions: 63
  rolling_loss_window_sessions: 126
  quarantine_sessions: 126
  max_stop_losses: 2
  cumulative_loss_limit: -0.15

consensus:
  minimum_votes: 0
  exit_smoothing_span: 1
  exit_score_quantile: 0.50
  rank_aggregation: mean

baselines:
  momentum_window: 21
  random_trials: 20
  random_seed: 7

diagnostics:
  write_neighbors: true

tabular_baselines:
  enabled: true
  reference_variant: m0_raw_static
  models:
    target_column: future_blended_alpha_63
    elastic_alpha: 0.001
    elastic_l1_ratio: 0.25
    tree_iterations: 200
    tree_leaf_nodes: 15
    knn_neighbors: 25
    pca_components: 32
    random_seed: 7

credibility:
  enabled: true
  block_lengths: [5, 21, 63]
  bootstrap_samples: 2000
  bootstrap_seed: 7
  paired_baselines: [equal_weight_buy_hold, momentum_21]
  pbo_blocks: 8

variants:
  - id: m0_raw_static
    description: Frozen pre-2022 raw C0 memory control.
    embedding_space: raw
    memory_mode: static
    targets: exact_c0
    memory_overrides: {}
    policy_overrides: {}

  - id: m1_raw_growing
    description: Causally growing raw C0 memory without temporal preference.
    embedding_space: raw
    memory_mode: growing
    targets: exact_c0
    memory_overrides: {}
    policy_overrides: {}

  - id: m2_raw_growing_half_life_2y
    description: Growing raw C0 memory with two-year decay and country-balanced evidence.
    embedding_space: raw
    memory_mode: growing
    targets: exact_c0
    memory_overrides:
      temporal_half_life_days: 730
      balance_group_column: market
    policy_overrides: {}

  - id: m2_raw_growing_half_life_4y
    description: Growing raw C0 memory with four-year decay and country-balanced evidence.
    embedding_space: raw
    memory_mode: growing
    targets: exact_c0
    memory_overrides:
      temporal_half_life_days: 1461
      balance_group_column: market
    policy_overrides: {}

  - id: m2_raw_growing_hard_window_4y
    description: Growing raw C0 memory limited to four years with country-balanced evidence.
    embedding_space: raw
    memory_mode: growing
    targets: exact_c0
    memory_overrides:
      maximum_memory_age_days: 1461
      balance_group_column: market
    policy_overrides: {}

gates:
  target_pooled_sharpe: 2.0
  maximum_drawdown: 0.20
  maximum_market_drawdown: 0.25
  minimum_positive_markets: 5
  minimum_baseline_wins: 4
  minimum_median_market_sharpe: 0.50
  maximum_profit_concentration: 0.35
  minimum_ensemble_seed_lift: 0.0

hardware:
  max_gpu_hours: 0.0
