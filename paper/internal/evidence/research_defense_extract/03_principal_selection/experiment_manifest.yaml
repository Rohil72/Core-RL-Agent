run:
  id: phase6_a30_final_v1
  strict_environment: true
  stale_lock_seconds: 900
  inputs:
  - configs/final_research_testbed.yaml
  - configs/final_encoder_training.yaml
  - configs/phase4e_cross_market_sharpe.yaml
  - requirements.txt
  - requirements-phase5-rl.txt
  source_patterns:
  - src/**/*.py
  - scripts/**/*.py
  - configs/**/*.yaml
  - requirements*.txt
  hardware:
    require_cuda: true
    gpu_count: 1
    cuda_visible_devices: '0'
    minimum_vram_gb: 6
    minimum_compute_capability:
    - 7
    - 5
    vram_fraction: 0.95
    allow_cpu_fallback: false
    amp: true
    checkpoint_interval_steps: 250
    minimum_free_storage_gb: 20
  budgets:
    data:
      max_gpu_hours: 0
    pilot:
      max_gpu_hours: 100
      hourly_cost_inr: 38.88
      max_cost_inr: 1500.0
    full:
      max_gpu_hours: 300
      hourly_cost_inr: 38.88
      max_cost_inr: 6000.0
    confirmation:
      max_gpu_hours: 60
      hourly_cost_inr: 38.88
jobs:
- id: data_US
  stage: data
  command:
  - .venv/bin/python
  - scripts/precompute_ground_truth.py
  - --config-path
  - reports/final_testbed/phase6_a30_final_v1/universes/US.yaml
  - --output-dir
  - data/international/US
  - --start
  - '2013-01-01'
  - --end
  - '2026-06-30'
  depends_on: []
  inputs:
  - reports/final_testbed/phase6_a30_final_v1/universes/US.yaml
  expected_outputs:
  - data/international/US/manifest.json
  uses_gpu: false
  gpu_count: 1
  estimated_hours: 0.0
